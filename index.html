<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Corefix - Systems Built to Ship</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap"
    rel="stylesheet">
</head>

<body class="bg-[#0A0A0A] text-[#FFFFFF] overflow-x-hidden antialiased">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>

  <!-- SVG Noise Filter over everything -->
  <svg style="display:none;">
    <filter id="noiseFilter">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" />
    </filter>
  </svg>
  <div class="pointer-events-none fixed inset-0 z-50 opacity-[0.03] before:absolute before:inset-0"
    style="filter: url(#noiseFilter);"></div>
</body>

</html>
